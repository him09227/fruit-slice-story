<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍉 Fruit Slice × Story Protocol</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
    user-select: none;
  }
  #gameCanvas { display: block; margin: 0 auto; touch-action: none; cursor: crosshair; }
  #ui {
    position: fixed; top: 10px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 12px; z-index: 10;
  }
  .box {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border-radius: 14px; padding: 6px 14px; text-align: center;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .box span { font-size: 10px; opacity: 0.7; display: block; letter-spacing: 1px; }
  .box strong { font-size: 22px; font-weight: 900; }
  .lives-row { display: flex; gap: 2px; font-size: 16px; }
  #connectBtn {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border: none; color: white; padding: 12px 28px;
    border-radius: 30px; font-size: 14px; font-weight: bold;
    cursor: pointer; z-index: 10;
    box-shadow: 0 4px 20px rgba(240,147,251,0.5);
    white-space: nowrap;
  }
  #toast {
    position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%);
    background: rgba(0,255,150,0.15); border: 1px solid rgba(0,255,150,0.4);
    padding: 10px 18px; border-radius: 20px; font-size: 12px;
    text-align: center; z-index: 10; max-width: 320px;
    display: none; backdrop-filter: blur(10px);
  }
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 20; gap: 14px;
  }
  #overlay h2 { font-size: 38px; }
  #overlay .fscore { font-size: 26px; color: #f093fb; font-weight: bold; }
  #overlay .new-record { color: #ffd700; font-size: 14px; }
  .btn {
    padding: 13px 32px; border-radius: 30px; border: none;
    font-size: 16px; cursor: pointer; font-weight: bold; min-width: 200px;
  }
  #registerBtn { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
  #restartBtn { background: #4ecdc4; color: #1a1a2e; }
  #startScreen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a1a2e, #0f3460);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 30; gap: 16px;
  }
  #startScreen h1 { font-size: 42px; }
  #startScreen p { opacity: 0.7; font-size: 14px; text-align: center; padding: 0 30px; }
  #startBtn {
    padding: 15px 40px; border-radius: 30px; border: none;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white; font-size: 18px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 20px rgba(240,147,251,0.5);
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui">
  <div class="box">
    <span>SCORE</span>
    <strong id="scoreDisplay">0</strong>
  </div>
  <div class="box">
    <span>LIVES</span>
    <div class="lives-row" id="livesDisplay">❤️❤️❤️</div>
  </div>
  <div class="box">
    <span>BEST</span>
    <strong id="bestDisplay">0</strong>
  </div>
</div>

<button id="connectBtn" onclick="connectWallet()">🔗 Connect Wallet</button>
<div id="toast"></div>

<div id="overlay">
  <h2>🍉 Game Over!</h2>
  <div class="fscore" id="finalScore"></div>
  <div class="new-record" id="newRecord"></div>
  <button class="btn" id="registerBtn" onclick="registerOnStory()">🏛️ Register on Story Protocol</button>
  <button class="btn" id="restartBtn" onclick="restartGame()">🔄 Play Again</button>
</div>

<div id="startScreen">
  <h1>🍉 Fruit Slice</h1>
  <p>Fruits ko slice karo!<br>💣 Bombs se bachna!<br>Story Protocol pe score register karo!</p>
  <button id="startBtn" onclick="startGame()">▶ Play Now</button>
  <p style="font-size:11px; margin-top:5px; opacity:0.5;">Powered by Story Protocol</p>
</div>

<script>
// ═══════════════════════════
//  CANVAS
// ═══════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
canvas.width  = Math.min(window.innerWidth, 480);
canvas.height = window.innerHeight;

// ═══════════════════════════
//  STATE
// ═══════════════════════════
let score = 0, lives = 3, gameRunning = false;
let fruits = [], particles = [], slashTrail = [];
let spawnTimer = 0, spawnInterval = 90, frameId;
let bestScore = parseInt(localStorage.getItem('fruitBest') || '0');
document.getElementById('bestDisplay').textContent = bestScore;

const FRUITS = ['🍎','🍊','🍋','🍇','🍉','🍓','🍑','🥝','🍍','🥭','🍌'];

// ═══════════════════════════
//  FRUIT
// ═══════════════════════════
class Fruit {
  constructor() {
    this.x      = Math.random() * (canvas.width - 80) + 40;
    this.y      = canvas.height + 50;
    this.vx     = (Math.random() - 0.5) * 5;
    this.vy     = -(Math.random() * 13 + 10);
    this.g      = 0.28;
    this.size   = 44;
    this.rot    = 0;
    this.rotSpd = (Math.random() - 0.5) * 0.18;
    this.sliced = false;
    this.alpha  = 1;
    this.missed = false;
    this.isBomb = Math.random() < 0.1;
    this.emoji  = this.isBomb ? '💣' : FRUITS[Math.floor(Math.random() * FRUITS.length)];
  }
  update() {
    this.vy += this.g;
    this.x  += this.vx;
    this.y  += this.vy;
    this.rot += this.rotSpd;
    if (this.sliced) this.alpha -= 0.06;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.font = `${this.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.emoji, 0, 0);
    ctx.restore();
  }
  dead() { return this.y > canvas.height + 70 || this.alpha <= 0; }
  hit(x, y) {
    return !this.sliced &&
           Math.abs(this.x - x) < this.size / 1.8 &&
           Math.abs(this.y - y) < this.size / 1.8;
  }
}

// ═══════════════════════════
//  PARTICLES
// ═══════════════════════════
class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*9;
    this.vy = (Math.random()-0.5)*9;
    this.life = 1;
    this.color = color;
    this.r = Math.random()*7+2;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.25; this.life -= 0.04;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#f093fb','#ff9a3c'];

// ═══════════════════════════
//  TRAIL
// ═══════════════════════════
function addTrail(x, y) {
  slashTrail.push({x, y, life:1});
  if (slashTrail.length > 18) slashTrail.shift();
}
function drawTrail() {
  if (slashTrail.length < 2) return;
  for (let i = 1; i < slashTrail.length; i++) {
    const a = slashTrail[i-1], b = slashTrail[i];
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = `rgba(255,255,255,${b.life * 0.9})`;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  slashTrail.forEach(p => p.life -= 0.06);
  slashTrail = slashTrail.filter(p => p.life > 0);
}

// ═══════════════════════════
//  SLICE
// ═══════════════════════════
function checkSlice(x, y) {
  fruits.forEach(f => {
    if (f.hit(x, y)) {
      f.sliced = true;
      if (f.isBomb) {
        lives--;
        updateLives();
        shake();
        for (let i=0; i<20; i++) particles.push(new Particle(x,y,'#ff4444'));
        if (lives <= 0) endGame();
      } else {
        score++;
        document.getElementById('scoreDisplay').textContent = score;
        for (let i=0; i<14; i++)
          particles.push(new Particle(x, y, COLORS[Math.floor(Math.random()*COLORS.length)]));
        // Score popup
        floatText(x, y, '+1');
      }
    }
  });
}

let floats = [];
function floatText(x, y, txt) {
  floats.push({x, y, txt, life:1, vy:-2});
}
function drawFloats() {
  floats.forEach(f => {
    ctx.save();
    ctx.globalAlpha = f.life;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(f.txt, f.x, f.y);
    ctx.restore();
    f.y += f.vy; f.life -= 0.03;
  });
  floats = floats.filter(f => f.life > 0);
}

function shake() {
  canvas.style.transition = 'none';
  canvas.style.transform = 'translate(8px,0)';
  setTimeout(()=>{ canvas.style.transform = 'translate(-8px,0)'; }, 80);
  setTimeout(()=>{ canvas.style.transform = 'none'; }, 160);
}

// ═══════════════════════════
//  LIVES UI
// ═══════════════════════════
function updateLives() {
  const h = ['❤️','❤️','❤️'];
  for (let i=lives; i<3; i++) h[i] = '🖤';
  document.getElementById('livesDisplay').innerHTML = h.join('');
}

// ═══════════════════════════
//  BACKGROUND
// ═══════════════════════════
function drawBg() {
  const grd = ctx.createLinearGradient(0,0,0,canvas.height);
  grd.addColorStop(0,'#1a1a2e');
  grd.addColorStop(1,'#0f3460');
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

// ═══════════════════════════
//  GAME LOOP
// ═══════════════════════════
function gameLoop() {
  if (!gameRunning) return;
  drawBg();

  // Spawn
  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    fruits.push(new Fruit());
    spawnTimer = 0;
    spawnInterval = Math.max(28, 90 - Math.floor(score/30)*6);
  }

  // Fruits
  fruits.forEach(f => { f.update(); f.draw(); });

  // Missed fruits
  fruits.forEach(f => {
    if (!f.sliced && !f.isBomb && !f.missed && f.y > canvas.height + 55) {
      f.missed = true;
      lives--;
      updateLives();
      if (lives <= 0) { endGame(); return; }
    }
  });
  fruits = fruits.filter(f => !f.dead());

  // Particles
  particles.forEach(p => { p.update(); p.draw(); });
  particles = particles.filter(p => p.life > 0);

  // Trail & floats
  drawTrail();
  drawFloats();

  frameId = requestAnimationFrame(gameLoop);
}

// ═══════════════════════════
//  START / END / RESTART
// ═══════════════════════════
function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  gameRunning = true;
  gameLoop();
}

function endGame() {
  gameRunning = false;
  cancelAnimationFrame(frameId);
  let isNew = false;
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('fruitBest', bestScore);
    document.getElementById('bestDisplay').textContent = bestScore;
    isNew = true;
  }
  document.getElementById('finalScore').textContent = `Score: ${score} 🏆`;
  document.getElementById('newRecord').textContent = isNew ? '🌟 New Best Record!' : '';
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('registerBtn').textContent = '🏛️ Register on Story Protocol';
  document.getElementById('registerBtn').disabled = false;
}

function restartGame() {
  score=0; lives=3; fruits=[]; particles=[]; slashTrail=[]; floats=[];
  spawnTimer=0; spawnInterval=90; gameRunning=true;
  document.getElementById('scoreDisplay').textContent='0';
  document.getElementById('overlay').style.display='none';
  updateLives();
  gameLoop();
}

// ═══════════════════════════
//  TOUCH + MOUSE
// ═══════════════════════════
let slicing = false;

canvas.addEventListener('mousedown', ()=> slicing=true);
canvas.addEventListener('mouseup',   ()=>{ slicing=false; slashTrail=[]; });
canvas.addEventListener('mousemove', e=>{
  if (!slicing || !gameRunning) return;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX-r.left, y = e.clientY-r.top;
  addTrail(x,y); checkSlice(x,y);
});
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); slicing=true; },{passive:false});
canvas.addEventListener('touchend',   e=>{ e.preventDefault(); slicing=false; slashTrail=[]; },{passive:false});
canvas.addEventListener('touchmove',  e=>{
  e.preventDefault();
  if (!gameRunning) return;
  const r = canvas.getBoundingClientRect();
  const t = e.touches[0];
  const x = t.clientX-r.left, y = t.clientY-r.top;
  addTrail(x,y); checkSlice(x,y);
},{passive:false});

// ═══════════════════════════
//  STORY PROTOCOL
// ═══════════════════════════
let provider, signer, walletAddress;

const STORY_CHAIN = {
  chainId: '0x5E9',
  chainName: 'Story Network Testnet (Iliad)',
  rpcUrls: ['https://testnet.storyrpc.io'],
  nativeCurrency: { name:'IP', symbol:'IP', decimals:18 },
  blockExplorerUrls: ['https://testnet.storyscan.xyz']
};

async function connectWallet() {
  if (!window.ethereum) {
    toast('⚠️ MetaMask app install karo!', true); return;
  }
  try {
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send('eth_requestAccounts', []);
    try {
      await window.ethereum.request({
        method:'wallet_switchEthereumChain',
        params:[{chainId: STORY_CHAIN.chainId}]
      });
    } catch(e) {
      if (e.code === 4902) {
        await window.ethereum.request({
          method:'wallet_addEthereumChain',
          params:[STORY_CHAIN]
        });
      }
    }
    signer = provider.getSigner();
    walletAddress = await signer.getAddress();
    const s = walletAddress.slice(0,6)+'...'+walletAddress.slice(-4);
    document.getElementById('connectBtn').textContent = `✅ ${s}`;
    toast('✅ Wallet connected! Khelo aur register karo 🎮');
  } catch(e) {
    toast('❌ ' + e.message.slice(0,60), true);
  }
}

async function registerOnStory() {
  if (!signer) {
    toast('⚠️ Pehle wallet connect karo!', true); return;
  }
  const btn = document.getElementById('registerBtn');
  btn.textContent = '⏳ Registering on Story...';
  btn.disabled = true;
  try {
    const ipData = `STORY_IP|game=FruitSlice|score=${score}|player=${walletAddress}|ts=${Date.now()}`;
    const tx = await signer.sendTransaction({
      to: walletAddress,
      value: ethers.utils.parseEther('0'),
      data: ethers.utils.hexlify(ethers.utils.toUtf8Bytes(ipData))
    });
    toast('⏳ Transaction pending...');
    await tx.wait();
    const short = tx.hash.slice(0,12)+'...';
    toast(`🎉 IP Registered! TX: ${short}`);
    btn.textContent = `✅ Registered! Score: ${score}`;
    setTimeout(()=>{
      window.open(`https://testnet.storyscan.xyz/tx/${tx.hash}`, '_blank');
    }, 1500);
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '🏛️ Register on Story Protocol';
    toast('❌ ' + e.message.slice(0,60), true);
  }
}

function toast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.background = isErr ? 'rgba(255,50,50,0.2)' : 'rgba(0,255,150,0.15)';
  el.style.borderColor = isErr ? 'rgba(255,50,50,0.5)' : 'rgba(0,255,150,0.4)';
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.style.display='none', 4000);
}
</script>
</body>
</html>
